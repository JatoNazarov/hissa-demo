<meta name="mobile-web-app-capable" content="yes">

<style>
@font-face{font-family:'Manrope';font-style:normal;font-weight:500;font-display:swap;src:url(assets/fonts/manrope-cyrillic-500-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-style:normal;font-weight:500;font-display:swap;src:url(assets/fonts/manrope-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/manrope-cyrillic-600-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/manrope-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/manrope-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/manrope-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:800;font-display:swap;src:url(assets/fonts/manrope-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-style:normal;font-weight:800;font-display:swap;src:url(assets/fonts/manrope-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
[hidden]{display:none!important}
/* Layout: one 402pt iPhone canvas. Full-bleed on phones, framed + scaled on desktop. Tokens mirror the Hissa Figma design system (single light theme, as in the app). */
:root{
  color-scheme: light;
  --bg:#f2f4f7; --surface:#ffffff; --sunken:#e4e7ec; --border:#d0d5dd;
  --text:#0c111d; --text2:#475467; --text3:#98a2b3;
  --brand:#ff655b; --brand-tint:rgba(255,101,91,.12); --red:#f55045;
  --success:#10b981; --success2:#12b76a; --success-tint:rgba(16,185,129,.12);
  --warn:#fa931e; --danger:#f04438; --link:#2563eb;
  --stage:#dfe3ea; --stage-text:#475467;
  --font:'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ios:-apple-system, 'SF Pro Text', system-ui, 'Manrope', sans-serif;
  --shadow-md:0 1px 3px rgba(12,17,29,.04),0 12px 16px rgba(12,17,29,.02);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{background:var(--stage);color:var(--text);font-family:var(--font);margin:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
img{display:block;max-width:none}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- stage / device ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.device-wrap{flex:none;width:422px;height:894px;transform-origin:center center}
.device{position:relative;width:422px;height:894px;border-radius:64px;background:#0c111d;padding:10px;box-shadow:0 40px 80px rgba(12,17,29,.25),inset 0 0 0 2px #2a3140}
.phone{position:relative;width:402px;height:874px;border-radius:54px;overflow:hidden;overflow:clip;background:var(--bg);isolation:isolate;--sat:54px;--sab:0px}
.side{max-width:300px;color:var(--stage-text);display:flex;flex-direction:column;gap:16px}
.side h1{margin:0;font-size:28px;line-height:32px;letter-spacing:-.04em;color:var(--text);font-weight:800;text-wrap:balance}
.side p{margin:0;font-size:15px;line-height:22px;font-weight:500}
.side .row{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;background:var(--brand);color:#fff}
.chip-btn.ghost{background:var(--surface);color:var(--text)}
.statusbar{position:absolute;inset:0 0 auto;height:54px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 52px;pointer-events:none;font-family:var(--ios);font-weight:600;font-size:17px}
.statusbar.dark{color:#fff}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:61;pointer-events:none}
.home-ind{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:140px;height:5px;border-radius:5px;background:#0c111d;z-index:61;pointer-events:none;opacity:.9}

@media (max-width:560px), (max-height:520px) and (pointer:coarse){
  body{background:var(--bg)}
  .stage{padding:0;display:block}
  .side{display:none}
  .device-wrap{width:100%;height:100%;transform:none!important}
  .device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .phone{width:100%;height:100%;border-radius:0;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
  .statusbar,.island,.home-ind{display:none}
}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;background:var(--bg);overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s;will-change:transform}
.screen[data-pos="right"]{transform:translateX(100%)}
.screen[data-pos="left"]{transform:translateX(-28%);opacity:.6}
.screen[data-pos="up"]{transform:translateY(100%)}
.screen.noanim{transition:none}
@media (prefers-reduced-motion:reduce){.screen{transition:opacity .2s}.screen[data-pos="right"],.screen[data-pos="left"],.screen[data-pos="up"]{transform:none;opacity:0}}
.col{width:calc(100% - 40px);margin-inline:auto}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:20;height:calc(var(--sat) + 62px);padding-top:calc(var(--sat) + 8px);display:flex;align-items:flex-start;justify-content:center;background:linear-gradient(var(--bg) 82%,rgba(242,244,247,0))}
.toolbar .title{font-family:var(--ios);font-weight:600;font-size:17px;line-height:44px;letter-spacing:-.4px}
.glass-btn{position:absolute;top:calc(var(--sat) + 8px);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 12px rgba(12,17,29,.08),inset 0 0 0 .5px rgba(12,17,29,.08)}
.glass-btn.l{left:16px}.glass-btn.r{right:16px}
.glass-btn.dark{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2);color:#fff}

/* ---------- HOME ---------- */
#home .spacer{height:calc(var(--sab) + 110px)}
.hdock{position:sticky;bottom:0;height:0;z-index:30}
.hdock .tabfade,.hdock .tabbar,.hdock .coach{position:absolute}
.hero{position:relative;padding-top:calc(var(--sat) + 6px);padding-bottom:24px;border-radius:0 0 28px 28px;background:radial-gradient(130% 100% at 50% 0%,rgba(242,244,247,0) 20%,rgba(255,101,91,.24) 100%),var(--bg)}
.hdr{height:48px;display:flex;align-items:center;justify-content:space-between}
.logo{position:relative;width:117px;height:28px}
.logo img{position:absolute;top:4px;width:15px;height:24px}
.logo span{position:absolute;left:49px;top:0;font-weight:700;font-size:28px;line-height:28px;letter-spacing:-1.12px;color:var(--text)}
.tb{display:flex;gap:20px;align-items:center;margin-left:auto;margin-right:24px}
.tb .ico{position:relative;width:30px;height:30px}
.tb .ico img{width:30px;height:30px}
.hide-ico img{position:absolute;inset:17.71% 11.46% 16.57% 11.46%;width:auto!important;height:auto!important}
.badge-dot{position:absolute;left:calc(50% + 3px);top:0;width:12px;height:12px;border-radius:20px;background:#f55045;border:2px solid #f2eff1}
.avatar{width:48px;height:48px;border-radius:60px;background:var(--brand);box-shadow:inset 0 8px 12px rgba(255,101,91,.9),inset 8px -8px 12px rgba(37,99,235,.8),inset -8px -8px 12px rgba(167,243,208,.8);border:1px solid rgba(0,0,0,.08);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;letter-spacing:-.4px}
.bal{display:flex;flex-direction:column;align-items:center;margin-top:28px}
.bal-lbl{display:flex;align-items:center;gap:2px;font-weight:700;font-size:14px;line-height:20px;letter-spacing:-.28px;color:var(--text2)}
.bal-num{margin-top:0;display:flex;align-items:baseline;gap:6px}
.bal-num b{font-weight:700;font-size:32px;line-height:40px;letter-spacing:-.64px}
.bal-num i{font-style:normal;font-weight:800;font-size:18px;color:var(--text2);letter-spacing:-.36px}
.cash-pill{margin-top:12px;display:flex;gap:4px;padding:8px 12px;border-radius:60px;background:var(--surface);font-weight:700;font-size:14px;line-height:20px;letter-spacing:-.28px}
.cash-pill .g{color:var(--success2)} .cash-pill .s{color:var(--text2)}
.limit{position:relative;margin:28px auto 0;width:calc(100% - 48px);height:72px;border-radius:60px;background:var(--surface);box-shadow:0 12px 16px rgba(12,17,29,.02);overflow:hidden;text-align:left;display:block}
.mini{position:absolute;left:16px;top:10px;width:72px;height:52px;border-radius:12px;background:var(--brand);overflow:hidden;box-shadow:0 8px 12px rgba(255,101,91,.16),inset 1px 1px 2px rgba(255,255,255,.2)}
.mini .glow{position:absolute;left:-28px;top:-28px;width:68px;height:68px}
.mini .ic{position:absolute;left:8px;top:8px;width:30px;height:16px}
.mini span{position:absolute;left:6px;bottom:6px;font-weight:700;font-size:10px;line-height:12px;color:#fff;letter-spacing:-.2px}
.limit .l1{position:absolute;left:100px;top:12px;font-weight:600;font-size:14px;line-height:20px;letter-spacing:-.28px;color:var(--brand)}
.limit .l2{position:absolute;left:100px;top:36px;font-weight:800;font-size:18px;line-height:20px;letter-spacing:-.36px}
.ring{position:absolute;right:12px;top:12px;width:48px;height:48px}
.ring svg{position:absolute;inset:0}
.ring img{position:absolute;left:14px;top:14px;width:20px;height:20px}
.transfer{margin:16px auto 0;width:calc(100% - 48px);height:48px;border-radius:20px;background:rgba(255,255,255,.32);display:flex;align-items:center;padding:0 12px;gap:10px;font-weight:600;font-size:14px;letter-spacing:-.28px;color:var(--text2);text-align:left}
.transfer .t-ico{width:28px;height:28px;transform:rotate(90deg)}
.transfer .grow{flex:1}
.transfer .scan{width:28px;height:28px}
.tiles{margin:16px auto 0;width:calc(100% - 48px);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{position:relative;height:70px;border-radius:20px;background:rgba(255,255,255,.32);display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:6px;font-weight:700;font-size:12px;line-height:12px;letter-spacing:-.24px}
.tile img{width:30px;height:30px}
.qr-ico{position:relative;width:30px;height:30px}
.tile.pulse::after{content:"";position:absolute;inset:-4px;border-radius:24px;border:2px solid var(--brand);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:1;transform:scale(.96)}100%{opacity:0;transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.tile.pulse::after{animation:none}}

.offers{display:flex;gap:12px;margin-top:28px;padding-inline:20px;overflow-x:auto;scrollbar-width:none}
.offers::-webkit-scrollbar,.cards::-webkit-scrollbar{display:none}
.offer{position:relative;flex:none;width:110px;height:108px;border-radius:22px;overflow:hidden;text-align:left;color:#fff;box-shadow:inset 0 0 1px rgba(12,17,29,.12)}
.offer p{position:absolute;left:12px;bottom:12px;margin:0;width:88px;font-weight:700;font-size:12px;line-height:13px;letter-spacing:-.24px}
.offer .oi{position:absolute;left:10px;top:10px;width:28px;height:28px;overflow:hidden}
.hot{display:grid;grid-template-columns:repeat(4,60px);justify-content:space-between;margin:32px auto 0;width:calc(100% - 66px)}
.hp{width:60px;display:flex;flex-direction:column;align-items:center;gap:8px;white-space:nowrap;font-weight:700;font-size:10px;line-height:12px;letter-spacing:-.2px;text-align:center}
.hp .b{position:relative;width:60px;height:60px;border-radius:20px;background:var(--sunken)}
.hp .b img{position:absolute;width:64px;height:64px;left:-8px;top:-8px;filter:drop-shadow(6px 6px 8px rgba(12,17,29,.04))}
.cb{position:absolute;right:-2px;bottom:-2px;padding:1px 3px;border-radius:40px;background:var(--success2);border:2px solid var(--bg);color:#fff;font-weight:700;font-size:10px;line-height:12px}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin-top:28px}
.sec-t h2{margin:0;font-weight:700;font-size:14px;line-height:20px;letter-spacing:-.28px;color:var(--text2)}
.pill-btn{padding:8px 16px;border-radius:60px;background:var(--surface);font-weight:600;font-size:14px;line-height:20px;letter-spacing:-.28px}
.cards{display:flex;gap:8px;margin-top:16px;padding-inline:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.icard{position:relative;flex:none;width:340px;max-width:calc(100vw - 52px);height:186px;border-radius:24px;background:var(--surface);box-shadow:0 12px 16px rgba(12,17,29,.02);scroll-snap-align:start;text-align:left;overflow:hidden}
.icard.new{animation:pop .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:none;opacity:1}}
.dots{position:absolute;left:16px;top:16px;display:flex;gap:1px}
.d{position:relative;width:14px;height:20px;border-radius:1px 10px 10px 1px;background:var(--brand)}
.d.next{opacity:.6}.d.rest{opacity:.1}.d.over{background:var(--sunken)}
.d.paid::after{content:"";position:absolute;left:1px;top:4px;width:12px;height:12px;background:url(assets/done-round.svg) center/12px no-repeat}
.d.late{width:20px;border-radius:20px;background:var(--danger);margin-inline:1px}
.icard .prog{position:absolute;right:44px;top:16px;font-weight:600;font-size:14px;line-height:20px;letter-spacing:-.28px}
.icard .chev{position:absolute;right:16px;top:16px;width:20px;height:20px}
.icard .sub{position:absolute;left:16px;top:52px;font-weight:600;font-size:10px;line-height:12px;color:var(--text3);letter-spacing:-.2px}
.icard .nm{position:absolute;left:16px;top:68px;font-weight:600;font-size:14px;line-height:20px;letter-spacing:-.28px}
.icard .amt{position:absolute;left:16px;top:100px;display:flex;align-items:baseline;gap:6px}
.icard .amt b{font-weight:800;font-size:24px;line-height:28px;letter-spacing:-.48px}
.icard .amt i{font-style:normal;font-weight:600;font-size:14px;color:var(--text3);letter-spacing:-.28px}
.due{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:40px;background:var(--surface);border:1px solid rgba(18,183,106,.12);font-weight:600;font-size:12px;line-height:16px;letter-spacing:-.24px;color:var(--success2)}
.due img{width:16px;height:16px}
.due.o{border-color:rgba(250,147,30,.12);color:var(--warn)}
.due.r{border-color:rgba(240,68,56,.12);color:var(--danger)}
.slogo{position:absolute;right:16px;bottom:16px;width:40px;height:40px;border-radius:62px;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 2px rgba(12,17,29,.2);display:grid;place-items:center}
.slogo.k{background:var(--surface)}
.stores{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.store{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.store .lg{position:relative;flex:none;width:60px;height:60px;border-radius:80px;background:#fff;overflow:hidden;box-shadow:0 12px 16px rgba(12,17,29,.02);display:grid;place-items:center}
.store .in{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.store .in b{font-weight:700;font-size:16px;line-height:20px;letter-spacing:-.32px}
.store .in span{font-weight:600;font-size:12px;line-height:12px;letter-spacing:-.24px;color:var(--text3)}
.store .in span.g{color:var(--success2)}
.dist{padding:8px;border-radius:40px;background:var(--bg);border:1px solid var(--sunken);font-weight:600;font-size:12px;line-height:12px;color:var(--text2)}
.map{position:relative;display:block;margin-top:20px;height:140px;border-radius:20px;border:4px solid #fff;overflow:hidden;background:#fff;box-shadow:0 12px 16px rgba(12,17,29,.02);width:100%}
.map img{position:absolute;left:50%;top:50%;width:543px;height:522px;transform:translate(calc(-50% - .5px),calc(-50% - 37px));object-fit:cover}
.map span{position:absolute;right:8px;bottom:8px;padding:8px 16px;border-radius:60px;background:#fff;font-weight:600;font-size:14px;line-height:20px;letter-spacing:-.28px}
.tabfade{left:0;right:0;bottom:0;height:calc(var(--sab) + 100px);background:linear-gradient(180deg,rgba(242,244,247,0),rgba(242,244,247,.4) 40%,rgba(242,244,247,.7) 60%,#f2f4f7);pointer-events:none;z-index:30}
.tabbar{left:50%;bottom:max(21px,calc(var(--sab) - 8px));transform:translateX(-50%);width:328px;height:62px;border-radius:1000px;background:rgba(255,255,255,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:1.25px 0 0 -.75px #d0d0d0,-1.25px 0 0 -.75px #d0d0d0,0 0 0 .5px #e8e8e8,0 8px 15px rgba(0,0,0,.02);display:flex;padding:4px;z-index:31}
.tab{position:relative;width:80px;height:54px;border-radius:60px;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:0;font-weight:700;font-size:10px;line-height:12px;letter-spacing:-.2px}
.tab img.ti{width:30px;height:30px;margin-bottom:6px}
.tab.on{background:rgba(245,80,69,.12);color:#f55045}
.tab .hd{position:relative;width:30px;height:18px;margin:4px 0 14px}
.tab .hd img{position:absolute;top:0;width:10px;height:18px}

/* coach */
.coach{left:12px;right:12px;bottom:calc(max(21px,calc(var(--sab) - 8px)) + 74px);z-index:40;background:#0c111d;color:#fff;border-radius:24px;padding:16px 16px 16px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 20px 40px rgba(12,17,29,.25);animation:rise .5s .3s both cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.coach .k{flex:none;width:44px;height:44px;border-radius:16px;background:#fff;display:grid;place-items:center}
.coach .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.coach .tag{align-self:flex-start;font-size:10px;line-height:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.coach b{font-size:15px;line-height:20px;letter-spacing:-.3px}

/* ---------- PAY ---------- */
let last = null;
function pay() {
  const btn = $('#payBtn'); if (!btn || btn.classList.contains('busy')) return;
  btn.classList.add('busy');
  const now = new Date();
  const inst = co.method === 'inst';
  const r = calc(co.term, inst && co.useCash);
  last = { inst, r, at: now, first: addMonths(now, 1), card: co.card, cashBefore: S.cashback };
  setTimeout(() => {
    if (inst) {
      S.limit -= r.total;
      S.cashback = S.cashback - r.cashUsed + r.cashback;
      const days = Math.round((last.first - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
      S.extraInstallments.unshift({
        act: 'sched-home', sub: `Рассрочка на ${r.n} ${plural(r.n,'месяц','месяца','месяцев')}`, name: 'Korzinka', amt: fmt(r.monthly), prog: `0 из ${r.n} ${plural(r.n,'платежа','платежей','платежей')}`,
        dots: Array.from({ length: r.n }, (_, i) => i === 0 ? 'next' : 'rest'), due: ['', `До платежа осталось ${days} ${plural(days,'день','дня','дней')}`],
        logo: `<span class="slogo k"><img src="${A}korzinka.svg" width="26" height="21" alt="Korzinka"></span>`, sched: last
      });
      S.justBought = true;
    } else {
      S.balance -= PRICE; S.cards[co.card] -= PRICE;
    }
    S.purchases++; S.coachDone = true;
    buzz([20, 40, 20]);
    go('success');
  }, 1100);
}

      <div class="rc-foot"><p style="margin:0">По вопросам возврата товара обращайтесь<br>в магазин</p><p style="margin:0">Служба поддержки Hissa: <span>+998 00 000 00 00</span></p></div>
    </div>
    <div class="bottom-btns"><button class="cta" data-act="share">Поделиться</button></div></div>`;
};

/* ---------- SHEETS ---------- */
function sheet(html) {
  closeSheet(true);
  const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.dataset.act = 'sheet-x';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role','dialog'); sh.innerHTML = html;
  const ph = $('#phone'); ph.appendChild(scrim); ph.appendChild(sh);
  requestAnimationFrame(() => { scrim.classList.add('show'); sh.classList.add('show'); });
}
function closeSheet(now) {
  document.querySelectorAll('.sheet,.scrim').forEach(n => { if (now) return n.remove(); n.classList.remove('show'); setTimeout(() => n.remove(), 350); });
}
function cardsSheet() {
  sheet(`<div class="sh-h"><span class="t"><b>Ваши карты</b></span><button class="closeb" data-act="sheet-x" aria-label="Закрыть">${xIcon}</button></div>
    <div class="sh-body"><div class="clist">${CARDS.map(n => `<button class="citem" data-card="${n}">${bcard(n)}<span class="nm"><b class="tnum">${fmt(S.cards[n])},00 сум</b><span>${bankOf(n)}</span></span>${n === co.card ? `<img class="ck" src="${A}check-fill.svg" alt="Выбрана">` : '<span class="ck"></span>'}</button>`).join('')}</div></div>`);
}
function schedSheet(L) {
  const r = L.r;
  const rows = Array.from({ length: r.n }, (_, i) => `<div class="srow"><i></i><span>${dLong(addMonths(L.at, i + 1))}</span><b class="tnum">${fmt(i === r.n - 1 ? r.total - r.monthly * (r.n - 1) : r.monthly)} сум</b></div>`).join('');
  sheet(`<div class="sh-h"><span class="t"><b>График платежей</b><span>Korzinka • ${dLong(L.at)}</span></span><button class="closeb" data-act="sheet-x" aria-label="Закрыть">${xIcon}</button></div>
    <div class="sh-body">
      <div class="sched-sum"><b class="tnum">${fmt(r.total)} сум</b><span>${r.n} ${plural(r.n,'платёж','платежа','платежей')} • ${r.over ? `переплата ${fmt(r.total - r.base)} сум` : '<em>без переплаты</em>'}</span></div>
      <div class="srows">${rows}</div>
      <div class="info"><div><img src="${A}date-today.svg" width="20" height="20" alt="" style="filter:grayscale(1) brightness(.4)">Спишем автоматически в день платежа</div>
        <div><img src="${A}ipoteka.svg" width="20" height="20" alt=""><span>Рассрочка от Ipoteka Bank</span><a href="#" data-act="soon">Договор ›</a></div></div>
    </div>
    <div class="sh-foot"><button class="cta" data-act="sheet-x">Закрыть</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-term],[data-card],[data-lterm],[data-q],[data-lang]');
  if (!t || !t.closest('#phone, .side, #present')) return;
  if (t.tagName === 'A') e.preventDefault();
  if (t.dataset.term) { e.stopPropagation(); co.term = +t.dataset.term; rr('checkout'); return; }
  if (t.dataset.lang) { pfLang = t.dataset.lang; rr('profile'); return; }
  if (t.dataset.lterm) { lmTerm = +t.dataset.lterm; rr('limit'); return; }
  if (t.dataset.q) { const o = t.classList.toggle('open'); t.firstElementChild.setAttribute('aria-expanded', o); return; }
  if (t.dataset.card) { co.card = t.dataset.card; closeSheet(); rr('checkout'); return; }
  const a = t.dataset.act;
  e.stopPropagation();
  switch (a) {
    case 'soon': toast(SOON); break;
    case 'scan': S.coachDone = true; go('scan'); break;
    case 'limit': lmTerm = 12; go('limit'); break;
    case 'profile': go('profile'); break;
    case 'bio': pfBio = !pfBio; rr('profile'); break;
    case 'coach-x': S.coachDone = true; rr('home'); break;
    case 'back':
      if (current === 'scan' || current === 'checkout' || current === 'limit' || current === 'profile') go('home', 'back');
      else if (current === 'receipt') go('success', 'back');
      break;
    case 'm-inst': if (co.method !== 'inst') { co.method = 'inst'; rr('checkout'); } break;
    case 'm-own': if (co.method !== 'own') { co.method = 'own'; co.useCash = false; rr('checkout'); } break;
    case 'cash': co.useCash = !co.useCash; rr('checkout'); break;
    case 'cards': cardsSheet(); break;
    case 'pay': pay(); break;
    case 'sched': schedSheet(last); break;
    case 'sched-home': { const c = S.extraInstallments.find(x => x.act === 'sched-home'); if (c) schedSheet(c.sched); break; }
    case 'sheet-x': closeSheet(); break;
    case 'receipt': go('receipt'); break;
    case 'done': go('home', 'back'); setTimeout(() => { const sc = screens.home.querySelector('.sc-in'); if (sc) sc.scrollTo({ top: 0 }); }, 0); break;
    case 'share': {
      const text = `Hissa · Korzinka · ${fmt(PRICE)} сум`;
      if (navigator.share) navigator.share({ title: 'Чек Hissa', text }).catch(() => {}); else toast('В приложении здесь откроется «Поделиться»');
      break;
    }
  }
}, true);
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') closeSheet();
});

/* ---------- device scaling on desktop ---------- */
function fit() {
  const w = $('#deviceWrap');
  if (matchMedia('(max-width:560px), (max-height:520px) and (pointer:coarse)').matches) { w.style.transform = ''; return; }
  const s = Math.min(1, (innerHeight - 40) / 894, (innerWidth - 40) / 422);
  w.style.transform = `scale(${s})`; w.style.margin = `${(894 * s - 894) / 2}px ${(422 * s - 422) / 2}px`;
}
addEventListener('resize', fit); fit();

/* ---------- presenter (QR for the audience) ---------- */
function defaultUrl() { try { const u = new URL(location.href); u.hash = ''; u.search = ''; return u.toString(); } catch (e) { return location.href.split('#')[0]; } }
function qrSVG(text) {
  if (!window.qrcode) return '<p style="padding:40px">QR-библиотека не загрузилась</p>';
  const q = qrcode(0, 'H'); q.addData(text, 'Byte'); q.make();
  const n = q.getModuleCount(), quiet = 0; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) {
    const inFinder = (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
    if (!inFinder) d += `M${c} ${r}h1.02v1.02h-1.02z`;
  }
  const finder = (x, y) => `<rect x="${x + .5}" y="${y + .5}" width="6" height="6" rx="0" fill="none" stroke="#0c111d" stroke-width="1"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" rx="0" fill="#0c111d"/>`;
  return `<svg viewBox="${-quiet} ${-quiet} ${n + quiet * 2} ${n + quiet * 2}" role="img" aria-label="QR-код прототипа"><path d="${d}" fill="#0c111d"/>${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}
let presentUrl = null;
function openPresent() {
  const p = $('#present');
  if (presentUrl === null) { try { presentUrl = localStorage.getItem('hissa-present-url') || defaultUrl(); } catch (e) { presentUrl = defaultUrl(); } }
  p.innerHTML = `<button class="glass-btn pr-x" data-act="present-x" aria-label="Закрыть" style="position:absolute">${xIcon}</button>
    <div class="pr">
      <div class="pr-qr" id="prQr">${qrSVG(presentUrl)}<span class="mark"><div><img src="${A}hissa-icon.svg" width="40" height="22" alt=""></div></span></div>
      <div class="pr-t">
        <span class="eb">Hissa · QR оплата</span>
        <h1>Оплатите покупку в Korzinka</h1>
        <p>Наведите камеру телефона на QR-код. Откроется приложение Hissa — выберите срок рассрочки и оплатите.</p>
        <div class="pr-check"><img src="${A}korzinka.svg" width="34" height="27" alt=""><span>Korzinka · чек на <b class="tnum">${fmt(PRICE)} сум</b></span></div>
        <label class="pr-url" for="prUrl">Ссылка в QR-коде<input id="prUrl" type="url" value="${presentUrl.replace(/"/g,'&quot;')}" spellcheck="false"></label>
        <div class="pr-actions"><button class="chip-btn ghost" data-act="present-x" style="background:var(--bg)">Вернуться к прототипу</button></div>
      </div>
    </div>`;
  p.hidden = false;
  $('#prUrl').addEventListener('input', e => { presentUrl = e.target.value.trim() || defaultUrl(); try { localStorage.setItem('hissa-present-url', presentUrl); } catch (er) {} $('#prQr').firstElementChild.outerHTML = qrSVG(presentUrl); });
  if (location.hash !== '#present') history.replaceState(null, '', '#present');
}
function closePresent() { $('#present').hidden = true; if (location.hash === '#present') history.replaceState(null, '', location.pathname + location.search); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act="present-x"]'); if (t) { closePresent(); return; }
  if (e.target.closest('#openPresent')) openPresent();
  if (e.target.closest('#resetDemo')) { S = init(); resetCheckout(); closeSheet(true); current = null; Object.values(screens).forEach(s => { s.classList.add('noanim'); s.dataset.pos = 'right'; }); go('home', 'forward', true); toast('Демо сброшено'); }
});
addEventListener('hashchange', () => { location.hash === '#present' ? openPresent() : closePresent(); });

/* ---------- boot ---------- */
go('home', 'forward', true);
if (location.hash === '#present') openPresent();
})();
</script>
